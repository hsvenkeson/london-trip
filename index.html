<style>
  :root {

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: Inter, -apple-system, system-ui, sans-serif; color: var(--ink); background: #e5e7eb; overflow: hidden; }

  .pin { background: none; border: none; }

  .leaflet-popup-content { font-size: 13px; line-height: 1.45; margin: 12px 14px; }
  .leaflet-popup-content b { font-size: 14px; }
  .stn { background: rgba(255,255,255,.95); border: none; border-radius: 6px; padding: 2px 6px; font-size: 11px; font-weight: 600; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .stn:before { display: none; }
  .ok { color: var(--green); font-weight: 800; }

  /* ---------- top bar ---------- */
  #top { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 10px; right: 10px; z-index: 900; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .chipbtn { pointer-events: auto; background: rgba(255,255,255,.96); border: none; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer; color: var(--ink); }
  #brand { pointer-events: auto; background: rgba(15,23,42,.92); color: #fff; border-radius: 14px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #brand b { display: block; font-size: 14px; }
  #brand span { font-size: 11px; opacity: .75; }
  #key { position: fixed; top: calc(env(safe-area-inset-top) + 56px); right: 10px; z-index: 900; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); font-size: 12.5px; line-height: 1.75; display: none; min-width: 190px; }
  #key.show { display: block; }
  #key h4 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #key h4:not(:first-child) { margin-top: 8px; }
  #key svg { vertical-align: -4px; margin-right: 8px; }

  /* ---------- bottom sheet (phone) ---------- */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 92vh; height: 92dvh; z-index: 1000; background: var(--bg);
           border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.18); display: flex; flex-direction: column;
           transform: translateY(calc(100% - var(--sheet-peek))); transition: transform .28s cubic-bezier(.2,.8,.2,1); touch-action: none; }
  #sheet.dragging { transition: none; }
  #grab { padding: 8px 16px 6px; cursor: grab; flex: 0 0 auto; }
  #grab .bar { width: 40px; height: 5px; border-radius: 99px; background: #cbd5e1; margin: 0 auto 8px; }
  #grab h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  #grab .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
  #days { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; padding: 6px 12px calc(env(safe-area-inset-bottom) + 24px); touch-action: pan-y; }

  .day { background: #fff; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); border: 1px solid var(--line); overflow: hidden; }
  .day.today { border-color: #0f172a; box-shadow: 0 0 0 1px #0f172a; }
  .dhead { display: grid; grid-template-columns: 30px 1fr auto 18px; align-items: center; gap: 10px; padding: 12px 12px; cursor: pointer; user-select: none; }
  .dhead .when { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dhead .when .now { color: #fff; background: #0f172a; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .dhead .ttl { font-size: 15px; font-weight: 700; margin-top: 1px; }
  .chev { transition: transform .2s; color: var(--muted); font-size: 14px; text-align: center; }
  .day.open .chev { transform: rotate(90deg); }
  .dbody { display: none; border-top: 1px solid var(--line); }
  .day.open .dbody { display: block; }
  .dnote { padding: 8px 14px; font-size: 12px; color: #475569; background: #f8fafc; border-bottom: 1px solid var(--line); }

  /* route switch */
  .sw { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .sw input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 99px; background: #cbd5e1; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .sw input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .2s; }
  .sw input:checked { background: #0f172a; }
  .sw input:checked::after { left: 18px; }

  .step { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; position: relative; }
  .step:last-child { border-bottom: none; }
  .step:active { background: #f1f5f9; }
  .step.sel { background: #fef9c3; }
  .step.past { opacity: .45; }
  .step.next { background: #ecfdf5; }
  .step.next::before { content: 'NEXT'; position: absolute; right: 10px; top: 8px; font-size: 9px; font-weight: 800; color: #047857; letter-spacing: .06em; }
  .step .t { font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .step .x { font-size: 13.5px; line-height: 1.4; }
  .step .x .w { font-weight: 600; }
  .ln { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; border-radius: 4px; padding: 1px 5px; margin-right: 5px; vertical-align: 1px; white-space: nowrap; }
  .chk { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; font-size: 10px; font-weight: 800; margin-left: 5px; vertical-align: 0; }
  .opt { font-size: 10px; font-weight: 700; color: #4338ca; background: #e0e7ff; border-radius: 4px; padding: 1px 5px; margin-left: 5px; }
  .foot { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 4px; }

  /* ---------- wide screens: side panel ---------- */
  @media (min-width: 900px) {
    #sheet { top: 0; bottom: 0; left: 0; right: auto; width: 400px; height: 100%; border-radius: 0; transform: none !important; box-shadow: 4px 0 20px rgba(0,0,0,.12); }
    #grab { padding-top: 18px; cursor: default; }
    #grab .bar { display: none; }
    #top { left: 410px; }
    #brand { display: none; }
  }
</style>

      ['19:45', '<span class="w">AFC Wimbledon v Luton</span>, Plough Lane <span class="opt">OPTIONAL</span>', 'Plough Lane', null, false],
      ['~21:40', 'Taxi back to the hotel (~25 min).', 'Hotel', 'cab', false]
    ],
    legs: [
      ['walk', ['Hotel','Hill Rise','Richmond']], ['district', 'Richmond>Hammersmith'], ['district', 'Hammersmith>Westminster'],
      ['walk', ['Westminster','War Rooms']], ['walk', ['War Rooms','Abbey']], ['walk', ['Abbey','Whitehall','Trafalgar']],
      ['walk', ['Trafalgar',"His Majesty's"]], ['walk', ["His Majesty's",'Trafalgar','Embankment']],
      ['district', 'Embankment>Earl\'s Court'], ['district', ["Earl's Court",'West Brompton','Fulham Broadway','Parsons Green','Putney Bridge','East Putney','Southfields','Wimbledon Park','Wimbledon']],
      ['walk', ['Wimbledon','Plough Lane']], ['cab', ['Plough Lane','Hotel']]
    ] },

  { id: 'd30', date: '2026-12-30', label: 'Wed Dec 30', title: 'Arsenal tour · Auld Hag · St Paul’s · Fulham v Arsenal',
    note: 'Long day. Fulham Palace is a home section: no Arsenal colours. Kick-off time can still move for TV.',
    steps: [
      ['08:45', 'Leave the hotel and walk down to Richmond station.', 'Richmond', 'walk', false],
      ['09:00', 'District line to Hammersmith, then Piccadilly line to Arsenal (~1 hr), then a 5 min walk.', 'Arsenal', 'piccadilly', false],
      ['10:15', '<span class="w">Arsenal stadium tour</span> and museum', 'Emirates', null, true],
      ['12:20', 'Piccadilly line to King’s Cross, then Northern line one stop to Angel.', 'Angel', 'northern', false],
      ['12:45', '<span class="w">Auld Hag</span> lunch (pizza crunch), 406 St John St', 'Auld Hag', 'walk', false],
      ['13:50', 'Northern line from Angel to Bank, then a 10 min walk.', 'Bank', 'northern', false],
      ['14:15', '<span class="w">St Paul’s Cathedral</span>: climb the dome', "St Paul's", 'walk', false],
      ['15:45', 'District line from Mansion House to Putney Bridge (change at Earl’s Court if needed), then a 10 min walk.', 'Putney Bridge', 'district', false],
      ['17:00', '<span class="w">Fulham Palace</span> hospitality opens (3 hrs before kick-off)', 'Fulham Palace', 'walk', true],
      ['~19:30', 'Walk through Bishops Park to Craven Cottage.', 'Craven Cottage', 'walk', false],
      ['20:00', '<span class="w">Fulham v Arsenal</span>, Riverside Stand', 'Craven Cottage', null, true],
      ['~22:00', 'Taxi back to the hotel (~20 min). Pack for tomorrow.', 'Hotel', 'cab', false]
    ],
    legs: [
      ['walk', ['Hotel','Hill Rise','Richmond']], ['district', 'Richmond>Hammersmith'], ['piccadilly', 'Hammersmith>Arsenal'],
      ['walk', ['Arsenal','Emirates']], ['walk', ['Emirates','Arsenal']], ['piccadilly', "Arsenal>King's Cross St Pancras"],
      ['northern', ["King's Cross St Pancras",'Angel']], ['walk', ['Angel','Auld Hag']], ['walk', ['Auld Hag','Angel']],
      ['northern', ['Angel','Old Street','Moorgate','Bank']], ['walk', ['Bank',"St Paul's"]], ['walk', ["St Paul's",'Mansion House']],
      ['district', "Mansion House>Earl's Court"], ['district', ["Earl's Court",'West Brompton','Fulham Broadway','Parsons Green','Putney Bridge']],
      ['walk', ['Putney Bridge','Fulham Palace']], ['walk', ['Fulham Palace','Craven Cottage']], ['cab', ['Craven Cottage','Hotel']]
    ] },

  { id: 'd31', date: '2026-12-31', label: 'Thu Dec 31', title: 'Fly home',
    note: 'BA219 leaves Heathrow T5 at 12:10. Check-in opens online 24 hrs before.',
    steps: [
      ['08:00', 'Breakfast and check out.', 'Hotel', null, true],
      ['08:45', 'Walk down to Richmond station with the bags (or a short taxi down the hill).', 'Richmond', 'walk', false],
      ['09:00', 'District line to Hammersmith (~20 min).', 'Hammersmith', 'district', false],
      ['09:25', 'Piccadilly line to Heathrow Terminal 5 (~45 min). Take a train going to Terminal 5, not Terminal 4.', 'Heathrow T5', 'piccadilly', false],
      ['~10:15', 'At Terminal 5, about 2 hours before departure.', 'Heathrow T5', null, false],
      ['12:10', '<span class="w">BA219 to Denver</span>', 'Heathrow T5', null, true]
    ],
    legs: [
      ['walk', ['Hotel','Hill Rise','Richmond']], ['district', 'Richmond>Hammersmith'], ['piccadilly', 'Hammersmith>Heathrow T5']
    ] }
];

// Single-day map files set this to a day id, e.g. 'd26'. The family site leaves it null.
const ONLY = null;
/* ===================== end of trip content ===================== */

const LINES = {
  piccadilly: { name: 'Piccadilly', color: '#003688' },
  district:   { name: 'District',   color: '#00782A' },
  hc:         { name: 'Ham & City', color: '#D9748B' },
  jubilee:    { name: 'Jubilee',    color: '#868F98' },
  northern:   { name: 'Northern',   color: '#000000' },
  victoria:   { name: 'Victoria',   color: '#0098D4' },
  cab:        { name: 'Taxi',       color: '#d97706', dash: '10 6' },
  southern:   { name: 'Southern rail', color: '#5aa02c', dash: '9 7' },
  swr:        { name: 'SW Railway', color: '#c8102e', dash: '9 7' },
  walk:       { name: 'Walk',       color: '#64748b', dash: '2 8' }
};
const SEQ = {
  piccadilly: ['Heathrow T5','Heathrow T2&3','Hatton Cross','Hounslow West','Hounslow Central','Hounslow East','Osterley','Boston Manor','Northfields','South Ealing','Acton Town','Turnham Green','Hammersmith','Barons Court',"Earl's Court",'Gloucester Road','South Kensington','Knightsbridge','Hyde Park Corner','Green Park','Piccadilly Circus','Leicester Square','Covent Garden','Holborn','Russell Square',"King's Cross St Pancras",'Caledonian Road','Holloway Road','Arsenal'],
  district: ['Richmond','Kew Gardens','Gunnersbury','Turnham Green','Stamford Brook','Ravenscourt Park','Hammersmith','Barons Court','West Kensington',"Earl's Court",'Gloucester Road','South Kensington','Sloane Square','Victoria',"St James's Park",'Westminster','Embankment','Temple','Blackfriars','Mansion House','Cannon Street','Monument','Tower Hill','Aldgate East'],
  southern: ['Victoria (rail)','Battersea Park','Clapham Junction','Wandsworth Common','Balham','Streatham Common','Norbury','Thornton Heath','Selhurst'],
  swr: ['Clapham Junction','Wandsworth Town','Putney','Barnes','Mortlake','North Sheen','Richmond']
};
function stops(line, spec) {
  if (Array.isArray(spec)) return spec;
  const [a, b] = spec.split('>'); const arr = SEQ[line]; const i = arr.indexOf(a), j = arr.indexOf(b);
  if (i < 0 || j < 0) throw new Error('Unknown stop in ' + line + ': ' + spec);
  return i <= j ? arr.slice(i, j + 1) : arr.slice(j, i + 1).reverse();
}

/* ---------- single-day mode ---------- */
if (ONLY) {
  DAYS.splice(0, DAYS.length, ...DAYS.filter(d => d.id === ONLY));
  for (let i = MARKERS.length - 1; i >= 0; i--) {
    const [cat, day] = MARKERS[i];
    const keep = day === ONLY || cat === 'hotel' || (cat === 'airport' && (ONLY === 'd26' || ONLY === 'd31'));
    if (!keep) MARKERS.splice(i, 1);
  }
}

/* ---------- icons ---------- */
const COLORS = { hotel:'#16a34a', stadium:'#1d4ed8', theatre:'#facc15', sight:'#111111', airport:'#dc2626' };
const CAT_LABEL = { airport:'Airport', hotel:'Hotel', stadium:'Stadiums', theatre:'Theatre', sight:'Things to see' };
const SHAPE = { d26:'circle', d27:'square', d28:'star', d29:'triangle', d30:'pentagon', d31:'diamond' };
function pinSvg(color, size) {
  const w = Math.round(size * 0.72);
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+size+'" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 34 12 34s12-13.2 12-22.1C24 5.3 18.6 0 12 0z" fill="'+color+'" stroke="#333" stroke-width="1.2"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg>';
}
function shapeSvg(shape, color, size, label) {
  const st = 'stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"';
  const body = {
    circle: '<circle cx="12" cy="12" r="10.5" fill="'+color+'" '+st+'/>',
    square: '<rect x="2" y="2" width="20" height="20" rx="3" fill="'+color+'" '+st+'/>',
    triangle: '<path d="M12 1.5 L23 22 L1 22 Z" fill="'+color+'" '+st+'/>',
    star: '<path d="M12 1 L14.9 8.6 L23 9 L16.7 14.1 L18.9 22 L12 17.5 L5.1 22 L7.3 14.1 L1 9 L9.1 8.6 Z" fill="'+color+'" '+st+'/>',
    diamond: '<path d="M12 1 L23 12 L12 23 L1 12 Z" fill="'+color+'" '+st+'/>',
    pentagon: '<path d="M12 1.5 L22.8 9.4 L18.7 22.3 L5.3 22.3 L1.2 9.4 Z" fill="'+color+'" '+st+'/>'
  }[shape];
  const ty = shape === 'triangle' ? 17.3 : shape === 'star' ? 14.4 : shape === 'pentagon' ? 13.6 : 12.6;
  const txt = label ? '<text x="12" y="'+ty+'" text-anchor="middle" dominant-baseline="middle" font-size="7.5" font-weight="800" font-family="Inter,sans-serif" fill="'+(color === COLORS.theatre ? '#111' : '#fff')+'">'+label+'</text>' : '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+body+txt+'</svg>';
}
function icon(html, w, h, anchorY) { return L.divIcon({ className: 'pin', html, iconSize: [w, h], iconAnchor: [w / 2, anchorY], popupAnchor: [0, -anchorY + 2] }); }

/* ---------- map ---------- */
const wide = () => window.matchMedia('(min-width: 900px)').matches;
const map = L.map('map', { zoomControl: false, attributionControl: true, zoomSnap: 0.5 });
if (wide()) L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.attributionControl.setPrefix(false);

const allBounds = L.latLngBounds([]);
const dayLayers = {}, dayLabels = {}, dayBounds = {};
DAYS.forEach(d => {
  const g = L.layerGroup(), labels = L.layerGroup(), b = L.latLngBounds([]);
  const keyStops = new Set(), allStops = new Set();
  d.legs.forEach(([line, spec]) => {
    const st = stops(line, spec), ll = st.map(n => { if (!PLACES[n]) throw new Error('Unknown place ' + n); return PLACES[n]; });
    const L_ = LINES[line];
    if (line !== 'walk') L.polyline(ll, { color: '#fff', weight: 9, opacity: .9, interactive: false }).addTo(g);
    L.polyline(ll, { color: L_.color, weight: line === 'walk' ? 4 : 5, opacity: .95, dashArray: L_.dash || null, lineCap: 'round' })
      .bindPopup('<b>' + d.label + '</b><br>' + (line === 'walk' ? 'Walk' : L_.name + (['southern','swr','cab'].includes(line) ? '' : ' line')) + ': ' + st[0].replace(' (rail)','') + ' → ' + st[st.length - 1].replace(' (rail)',''))
      .addTo(g);
    ll.forEach(p => { b.extend(p); allBounds.extend(p); });
    if (line !== 'walk' && line !== 'cab') { keyStops.add(st[0]); keyStops.add(st[st.length - 1]); st.forEach(n => allStops.add(n)); }
  });
  allStops.forEach(n => {
    const key = keyStops.has(n);
    L.circleMarker(PLACES[n], { radius: key ? 5.5 : 3, color: '#1f2937', weight: key ? 2 : 1.3, fillColor: '#fff', fillOpacity: 1 })
      .bindTooltip(n.replace(' (rail)', ' station').replace(' (H&C)', ' (H&C line)')).addTo(g);
    if (key) L.tooltip({ permanent: true, direction: 'right', offset: [7, 0], className: 'stn' })
      .setLatLng(PLACES[n]).setContent(n.replace(' (rail)', ' stn').replace(' (H&C)', ' H&C')).addTo(labels);
  });
  dayLayers[d.id] = g; dayLabels[d.id] = labels; dayBounds[d.id] = b;
});

const markers = [];
MARKERS.forEach(([cat, day, name, key, booked, line]) => {
  const ll = PLACES[key]; allBounds.extend(ll);
  const ic = day ? icon(shapeSvg(SHAPE[day], COLORS[cat], booked ? 32 : 26, day.slice(1)), booked ? 32 : 26, booked ? 32 : 26, (booked ? 32 : 26) / 2)
                 : icon(pinSvg(COLORS[cat], cat === 'hotel' ? 46 : 40), Math.round((cat === 'hotel' ? 46 : 40) * .72), cat === 'hotel' ? 46 : 40, cat === 'hotel' ? 46 : 40);
  const m = L.marker(ll, { icon: ic, zIndexOffset: cat === 'hotel' ? 1000 : booked ? 500 : 0 })
    .bindPopup('<b>' + name + (booked ? ' <span class="ok">✓</span>' : '') + '</b><br>' + line).addTo(map);
  m._day = day; markers.push(m);
});

/* ---------- state ---------- */
const londonToday = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date());
const todayDay = DAYS.find(d => d.date === londonToday);
const visible = {}; let focused = null;

function sheetPad() {
  if (wide()) return { paddingTopLeft: [420, 70], paddingBottomRight: [50, 40] };
  const sh = document.getElementById('sheet').getBoundingClientRect();
  const covered = Math.max(0, window.innerHeight - sh.top);
  return { paddingTopLeft: [24, 80], paddingBottomRight: [80, covered + 20] };
}
function setRoute(id, on) {
  visible[id] = on;
  if (on) dayLayers[id].addTo(map); else { map.removeLayer(dayLayers[id]); map.removeLayer(dayLabels[id]); }
  if (on && focused === id) dayLabels[id].addTo(map);
  const cb = document.querySelector('[data-sw="' + id + '"]'); if (cb) cb.checked = on;
}
function focusDay(id) {
  focused = id;
  Object.keys(dayLabels).forEach(k => map.removeLayer(dayLabels[k]));
  markers.forEach(m => m.setOpacity(!id || !m._day || m._day === id ? 1 : .35));
  if (id) {
    if (!visible[id]) setRoute(id, true);
    dayLabels[id].addTo(map);
    map.flyToBounds(dayBounds[id], Object.assign({ duration: .7, maxZoom: 15 }, sheetPad()));
  }
}

/* ---------- build the list ---------- */
const daysEl = document.getElementById('days');
const toMin = t => { const m = /(\d{1,2}):(\d{2})/.exec(t); return m ? +m[1] * 60 + +m[2] : null; };
DAYS.forEach(d => {
  const el = document.createElement('div'); el.className = 'day' + (todayDay && todayDay.id === d.id ? ' today' : ''); el.dataset.day = d.id;
  const nowTag = todayDay && todayDay.id === d.id ? '<span class="now">TODAY</span>' : '';
  el.innerHTML =
    '<div class="dhead"><div>' + shapeSvg(SHAPE[d.id], '#0f172a', 26, d.id.slice(1)) + '</div>' +
    '<div><div class="when">' + d.label + nowTag + '</div><div class="ttl">' + d.title + '</div></div>' +
    '<label class="sw" title="Show this day’s route"><input type="checkbox" data-sw="' + d.id + '"></label><div class="chev">▶</div></div>' +
    '<div class="dbody">' + (d.note ? '<div class="dnote">' + d.note + '</div>' : '') + '</div>';
  const body = el.querySelector('.dbody');
  d.steps.forEach(([t, txt, key, line, booked], i) => {
    const s = document.createElement('div'); s.className = 'step'; s.dataset.min = toMin(t) ?? '';
    const chip = line && LINES[line] ? '<span class="ln" style="background:' + LINES[line].color + '">' + LINES[line].name + '</span>' : '';
    s.innerHTML = '<div class="t">' + t + '</div><div class="x">' + chip + txt + (booked ? '<span class="chk">✓</span>' : '') + '</div>';
    s.addEventListener('click', () => {
      document.querySelectorAll('.step.sel').forEach(x => x.classList.remove('sel')); s.classList.add('sel');
      if (focused !== d.id) { focused = d.id; focusDay(d.id); }
      if (key && PLACES[key]) {
        map.flyTo(PLACES[key], 16, { duration: .7 });
        setTimeout(() => {
          const pad = sheetPad(); const off = (pad.paddingBottomRight[1] - pad.paddingTopLeft[1]) / 2;
          if (!wide()) map.panBy([0, off], { animate: true });
          L.popup({ offset: [0, -6] }).setLatLng(PLACES[key]).setContent('<b>' + t + '</b><br>' + txt.replace(/<span class="opt">.*?<\/span>/, '')).openOn(map);
        }, 750);
      }
    });
    body.appendChild(s);
  });
  el.querySelector('.dhead').addEventListener('click', e => {
    if (e.target.closest('.sw')) return;
    const open = !el.classList.contains('open');
    document.querySelectorAll('.day.open').forEach(x => x !== el && x.classList.remove('open'));
    el.classList.toggle('open', open);
    if (open) {
      const moving = !wide() && sheetState === 'peek';
      if (moving) setSheet('half');
      setTimeout(() => focusDay(d.id), moving ? 320 : 0);
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
    }
    else { focusDay(null); }
  });
  el.querySelector('input').addEventListener('change', e => setRoute(d.id, e.target.checked));
  daysEl.appendChild(el);
});
const foot = document.createElement('div'); foot.className = 'foot';
foot.innerHTML = '<span class="chk" style="margin:0 4px 0 0">✓</span> booked & confirmed · Times are UK time';
daysEl.appendChild(foot);
document.getElementById('updated').textContent = 'Updated ' + new Date(UPDATED + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

// "next up" on today's card
function markNext() {
  if (!todayDay) return;
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()).split(':');
  const now = +parts[0] * 60 + +parts[1];
  const steps = [...document.querySelectorAll('[data-day="' + todayDay.id + '"] .step')];
  let nextSet = false;
  steps.forEach((s, i) => {
    s.classList.remove('past', 'next');
    const m = s.dataset.min === '' ? null : +s.dataset.min;
    const nm = steps[i + 1] && steps[i + 1].dataset.min !== '' ? +steps[i + 1].dataset.min : null;
    if (m !== null && nm !== null && nm <= now) s.classList.add('past');
    else if (!nextSet && m !== null && (nm === null ? m >= now - 90 : nm > now)) { s.classList.add('next'); nextSet = true; }
  });
}

/* ---------- key ---------- */
document.getElementById('key').innerHTML =
  '<h4>Places</h4>' + Object.keys(CAT_LABEL).map(k => '<div>' + (k === 'airport' || k === 'hotel' ? pinSvg(COLORS[k], 18) : shapeSvg('circle', COLORS[k], 15, '')) + CAT_LABEL[k] + '</div>').join('') +
  '<h4>Day (marker shape)</h4>' + DAYS.filter(d => MARKERS.some(m => m[1] === d.id)).map(d => '<div>' + shapeSvg(SHAPE[d.id], '#94a3b8', 15, '') + d.label + '</div>').join('') +
  '<h4>Routes</h4>' + ['piccadilly','district','hc','northern','victoria','southern','swr','cab','walk'].map(k => '<div><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="' + LINES[k].color + '" stroke-width="4" stroke-linecap="round" ' + (LINES[k].dash ? 'stroke-dasharray="' + (k === 'walk' ? '1 5' : '5 3') + '"' : '') + '/></svg>' + LINES[k].name + (['walk','southern','swr','cab'].includes(k)?'':' line') + '</div>').join('') +
  '<div style="margin-top:8px;color:#64748b">Bigger marker = booked <span class="ok">✓</span></div>';
document.getElementById('keybtn').addEventListener('click', () => document.getElementById('key').classList.toggle('show'));
map.on('click', () => document.getElementById('key').classList.remove('show'));

/* ---------- bottom sheet ---------- */
const sheet = document.getElementById('sheet'), grab = document.getElementById('grab');
let sheetState = 'peek';
function snapY(state) {
  const h = sheet.getBoundingClientRect().height, peek = 168;
  return state === 'full' ? 0 : state === 'half' ? h - window.innerHeight * 0.5 : h - peek;
}
function setSheet(state) { sheetState = state; if (!wide()) sheet.style.transform = 'translateY(' + snapY(state) + 'px)'; }
let dragY0 = null, base = 0, moved = false;
grab.addEventListener('pointerdown', e => { if (wide()) return; dragY0 = e.clientY; base = snapY(sheetState); moved = false; sheet.classList.add('dragging'); grab.setPointerCapture(e.pointerId); });
grab.addEventListener('pointermove', e => {
  if (dragY0 === null) return; const dy = e.clientY - dragY0; if (Math.abs(dy) > 4) moved = true;
  sheet.style.transform = 'translateY(' + Math.max(0, base + dy) + 'px)';
});
grab.addEventListener('pointerup', e => {
  if (dragY0 === null) return; sheet.classList.remove('dragging');
  const y = base + (e.clientY - dragY0); dragY0 = null;
  if (!moved) { setSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek'); return; }
  const opts = ['full', 'half', 'peek'].map(s => [s, Math.abs(snapY(s) - y)]).sort((a, b) => a[1] - b[1]);
  setSheet(opts[0][0]);
});
window.addEventListener('resize', () => { if (wide()) sheet.style.transform = ''; else setSheet(sheetState); });

/* ---------- start ---------- */
const startDay = ONLY ? DAYS[0] : todayDay;
if (ONLY) {
  document.querySelector('#grab h1').textContent = 'London · ' + DAYS[0].label;
  document.title = 'London · ' + DAYS[0].label;
}
if (startDay) {
  DAYS.forEach(d => setRoute(d.id, d.id === startDay.id));
  const el = document.querySelector('[data-day="' + startDay.id + '"]'); el.classList.add('open');
  setSheet('half'); map.fitBounds(allBounds);
  setTimeout(() => { focusDay(startDay.id); markNext(); }, 350);
  if (todayDay) setInterval(markNext, 60000);
} else {
  DAYS.forEach(d => setRoute(d.id, true));
  setSheet('peek');
  map.fitBounds(allBounds, sheetPad());
}
</script>
</body>
</html>
